<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="crossGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 18 20 L 22 20 M 20 18 L 20 22" stroke="#22c55e" stroke-width="2" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#crossGrid)"/>

  <!-- Glowing Heart Core -->
  <path d="M 256 180 C 256 180 200 90 130 90 C 50 90 30 190 110 270 L 256 420 L 402 270 C 482 190 462 90 382 90 C 312 90 256 180 256 180 Z" fill="#22c55e" opacity="0.15" filter="url(#neon)"/>
  <path d="M 256 180 C 256 180 200 90 130 90 C 50 90 30 190 110 270 L 256 420 L 402 270 C 482 190 462 90 382 90 C 312 90 256 180 256 180 Z" fill="none" stroke="#22c55e" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" filter="url(#neon)"/>

  <!-- Thick Pulse EKG Line (Cyan) -->
  <!-- We want it to strike dramatically across the heart -->
  <path d="M 40 280 L 130 280 L 190 160 L 260 400 L 320 220 L 370 280 L 472 280" fill="none" stroke="#06b6d4" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
  
  <!-- Highlight inner core for the pulse -->
  <path d="M 40 280 L 130 280 L 190 160 L 260 400 L 320 220 L 370 280 L 472 280" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>